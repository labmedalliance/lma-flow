[project]
name = "lma-flow"
version = "1.0.0"
description = "LMA Flow – self-hosted diagram editor, by text or drag and drop"
license = "AGPL-3.0-or-later"
authors = [{ name = "Janne Cadamuro / LabMed Alliance Inc." }]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
