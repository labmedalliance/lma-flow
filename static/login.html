<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="{{BASE}}">
  <title>Anmelden – Flow</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="center-page">
  <form id="login-form" class="card stack">
    <h1 class="brand">Flow</h1>
    <input id="username" type="text" placeholder="Benutzername" autocomplete="username" required autofocus>
    <input id="password" type="password" placeholder="Passwort" autocomplete="current-password" required>
    <button type="submit" class="primary">Anmelden</button>
    <p id="login-error" class="form-error" hidden></p>
    <p class="hint">Keine Patientendaten oder personenbezogenen Daten Dritter eintragen.</p>
  </form>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
