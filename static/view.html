<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="{{BASE}}">
  <meta name="robots" content="noindex, nofollow">
  <title>Diagramm – LMA Flow</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <span class="brand"><img class="brand-logo" src="img/lma-logo-mark.svg" alt="" width="24" height="24">LMA Flow</span>
    <span id="view-title" class="doc-title"></span>
    <span class="spacer"></span>
    <span class="zoom">
      <button id="zoom-out" type="button" aria-label="Verkleinern">−</button>
      <button id="zoom-fit" type="button">Einpassen</button>
      <button id="zoom-in" type="button" aria-label="Vergrößern">+</button>
    </span>
  </header>
  <main class="viewer">
    <div id="viewport" class="viewport">
      <div id="preview" class="preview"></div>
    </div>
    <p id="view-error" class="view-error" hidden></p>
  </main>
  <footer class="footer">Nur lesend freigegeben. · {{CREDIT}}</footer>
  <script src="vendor/mermaid/mermaid.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/view.js"></script>
</body>
</html>
